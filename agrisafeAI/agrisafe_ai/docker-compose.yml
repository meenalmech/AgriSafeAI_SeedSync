services:
  agrisafe:
    build: .
    ports:
      - "8011:8011"
    environment:
      DATABASE_URL: sqlite:////app/runtime/agrisafe.db
      DEMO_WEATHER_ENABLED: "true"
      LLM_ENABLED: "false"
      MAX_UPLOAD_MB: "10"
    volumes:
      - agrisafe_data:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  agrisafe_data:
